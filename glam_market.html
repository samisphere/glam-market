<!doctype html>

    <title>Glam Market</title>

  <body>
    <header>
      <div class="header-left-section">
        <a href="glam_market.html" class="header-link">
          <img
            src="images/icons/glam-logo.svg"
            width="100"
            class="brand-icon"
          />
        </a>
      </div>
      <div class="header-middle-section">
        <input type="text" placeholder="Search items" class="search-bar" />

          <img src="images/icons/search.svg" />

      </div>
      <div class="header-right-section">
        <a class="orders-link" href="">

          <span class="orders-text">& Orders</span>
        </a>
        <a class="cart-link" href="">
          <img src="images/icons/shopping-basket.svg" class="cart-icon" />

          <div class="cart-text">Cart</div>
        </a>
      </div>
