<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Glam Market</title>
  </head>
  <body>
    <header>
      <div class="header-up">
        <div class="header-left">
          <img src="images/icons/glam-logo.svg" alt="" />
        </div>
        <div class="header-middle">
          <input type="text" placeholder="search" />
          <button>
            <img src="images/icons/search.svg" width="40" alt="" />
          </button>
        </div>
        <div class="header-left">
          <a href="" class="returns-order">
            <span class="return">Returns</span>
            <span class="order">& Order</span></a
          >

          <div class="cart-profile">
            <a class="cart">
              <img src="images/icons/main-cart.svg" alt="" />
              <div class="cart-ammount">3</div>
            </a>
          </div>
          <div class="bowtie-icon">
            <img src="images/icons/bow-tie.svg" alt="" />
          </div>
        </div>
      </div>
      <div class="header-down">
        <a href="glam_market.html">Home</a>
        <a href="">Shop</a>
        <a href="">Blog</a>
        <a href="">Contact</a>
        <a href="">Services</a>
        <a href="">Login</a>
      </div>
    </header>
    <div class="main">
      <div class="products-grid">
        <div class="product-container">
          <div class="product-image-container">
            <img src="images/products/eye/eye1.PNG" alt="" />
          </div>
          <div class="product-name">Long lasting Mascara</div>
          <div class="product-rating">
            <img src="images/ratings/rating-45 1.svg" alt="" />
            <div class="product-rating-count">87</div>
          </div>
          <div class="product-price">QAR 45</div>
          <div class="product-quantity">
            <select>
              <option selected value="1">1</option>
              <option value="2">2</option>
              <option value="3">3</option>
              <option value="4">4</option>
              <option value="5">5</option>
              <option value="6">6</option>
              <option value="7">7</option>
              <option value="8">8</option>
              <option value="9">9</option>
              <option value="10">10</option>
            </select>
          </div>
          <div class="product-spacer"></div>
          <div class="added-to-cart">
            <img src="images/icons/checkbox.svg" alt="" />
          </div>
          <button>
            Add to Cart <img src="images/icons/cart.svg" alt="" />
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
