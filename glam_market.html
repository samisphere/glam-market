<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Glam Market</title>
    <link rel="icon" href="images/icons/glam-logo.svg" />
    <link rel="stylesheet" href="styles/components/headers/main_header.css" />
    <link rel="stylesheet" href="styles/components/products_card.css">
    <link rel="stylesheet" href="styles/pages/glam_market.css" />
  </head>
  <body>
    <header>
      <div class="header-up">
        <div class="header-left">
          <a href="glam_market.html">
            <img src="/assets/images/icons/glam-logo.svg" alt=""
          /></a>
        </div>
        <form class="header-middle">
          <input class="search-input" type="text" placeholder="search items ..." />
          <button type="submit" class="search-button">
            <img src="/assets/images/icons/search.svg" alt="" />
          </button>
        </form>
        <div class="search-results"></div>
        <div class="header-right">
          <a href="/pages/return_orders.html" class="returns-order">
            <span class="return">Returns</span>
            <span class="order">& Order</span></a
          >

          <div class="cart-profile">
            <a href="pages/cart_items.html" class="cart">
              <img src="/assets/images/icons/main-cart.svg" alt="" />
              <span class="cart-ammount"></span>
            </a>
            <a href="" class="profile">
              <img src="/assets/images/icons/user.svg" alt="" />
            </a>
          </div>
          <div class="bowtie-icon">
            <img src="/assets/images/illustrations/bow-tie.svg" alt="" />
          </div>
        </div>
      </div>
      <div class="header-nav">
        <a href="glam_market.html" class="active">Home</a>
        <a href="/pages/shop.html">Shop</a>
        <a href="">Contact</a>

        <div class="cat-decoration">
          <img
            class="cat-nav-body"
            src="/assets/images/illustrations/cat-nav-body.svg"
            alt=""
          />
        </div>
      </div>
    </header>
    <div class="main">
      <div class="products-grid"></div>
      <div class="see-more">
        <a href="pages/shop.html">See More
      </a>
      <img class = 'frog' src="/assets/images/illustrations/frog.svg" alt="">
      </div>
    </div>
    <script type="module" src="scripts/glam_market.js"></script>
  </body>
</html>
