<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles/checkout.css" />
    <title>Checkout</title>
  </head>
  <body>
    <header>
      <div class="header-logo">
        <a href="glam_market.html">
          <img src="images/icons/glam-logo.svg" alt=""
        /></a>
      </div>
      <div class="header-middle">Checkout</div>
      <div class="header-bow">
        <img src="images/icons/bow-tie.svg" alt="" />
      </div>
    </header>
    <div class="main">
      <div class="checkout-title">Review your order</div>
      <div class="order-details">
        <div class="ordered-products">
          <div class="product-all-details">
            <div class="product">
              <img src="images/products/eye/eye1.PNG" alt="" />
              <div class="product-details">
                <div class="product-name">Long lasting Mascara</div>
              </div>
              <div class="product-quantity">Quantity: 1</div>
              <div class="product-price">QAR 45</div>
              <div class="product-actions">
                <button class="update">
                  <img src="images/icons/update.svg" alt="" /> Update
                </button>
                <button class="delete">
                  <img src="images/icons/trash.svg" alt="" /> Delete
                </button>
              </div>
            </div>
            <div class="product-delivery-dates">
              <div class="title">Choose a delivery option</div>
              <div class="delivery-options">
                <label class="date-options">
                  <input type="radio" name="elivery-product-1" />                 
                  <div class="date">Tuesday, Nov 21</div>
                  <div class="shipping-charge">FREE Shipping</div>
                </label>
                <label class="date-options">
                  <input type="radio" name="elivery-product-1"  />
                  <div class="date">Tuesday, Nov 11</div>
                  <div class="shipping-charge">QAR 10.99 - Shipping</div>
                </label>
                <label class="date-options">
                  <input type="radio" name="elivery-product-1"  />
                  <div class="date">Tuesday, Nov 1</div>
                  <div class="shipping-charge">QAR 20.99 - Shipping</div>
                </label>
              </div>
            </div>
          </div>
          <div class="product-all-details">
            <div class="product">
              <img src="images/products/face/face3.PNG" alt="" />
              <div class="product-details">
                <div class="product-name">Cheeke Paletee</div>
              </div>
              <div class="product-quantity">Quantity: 2</div>
              <div class="product-price">QAR 90</div>
              <div class="product-actions">
                <button class="update">
                  <img src="images/icons/update.svg" alt="" /> Update
                </button>
                <button class="delete">
                  <img src="images/icons/trash.svg" alt="" /> Delete
                </button>
              </div>
            </div>
            <div class="product-delivery-dates">
              <div class="title">Choose a delivery option</div>
              <div class="delivery-options">
                <label class="date-options">
                  <input type="radio" name="elivery-product-2"  />
                  <div class="date">Tuesday, Nov 21</div>
                  <div class="shipping-charge">FREE Shipping</div>
                </label>
                <label class="date-options">
                  <input type="radio" name="elivery-product-2" />
                  <div class="date">Tuesday, Nov 11</div>
                  <div class="shipping-charge">QAR 10.99 - Shipping</div>
                </label>
                <label class="date-options">
                  <input type="radio" name="elivery-product-2"  />
                  <div class="date">Tuesday, Nov 1</div>
                  <div class="shipping-charge">QAR 20.99 - Shipping</div>
                </label>
              </div>
            </div>
          </div>
        </div>
        <div class="order-summary">
          <div class="order-title">Order Summery</div>
          <div class="items-shipping">
            <div class="items">
              Items(3)
              <div class="price">QAR 135</div>
            </div>
            <div class="shipping">
              Shipping & handling
              <div class="price">QAR 10.99</div>
            </div>
          </div>
          <div class="total-button">
            <div class="order-total">
              Order Total
              <div class="price">QAR 145.99</div>
            </div>
            <button class="place-order-button">Place your order</button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
