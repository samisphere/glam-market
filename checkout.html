<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles/checkout.css" />
    <title>Checkout</title>
  </head>
  <body>
    <header>
      <div class="header-logo">
        <a href="glam_market.html">
          <img src="images/icons/glam-logo.svg" alt=""
        /></a>
      </div>
      <div class="header-middle">
        <div class="checkout-page-title">
          Checkout (
          <div class="checkout-items-quantity"></div>
          )
        </div>
      </div>
      <div class="header-bow">
        <img src="images/icons/bow-tie.svg" alt="" />
      </div>
    </header>
    <div class="main">
      <div class="checkout-title">Review your order</div>
      <div class="order-details">
        <div class="ordered-products"></div>
        <div class="order-summary">
          <div class="order-title">Order Summary</div>
          <div class="items-shipping">
            <div class="items">
              <div class="item-label">
                Items ( <span class="item-quantity"></span> )
              </div>

              <div class="price">QAR 0</div>
            </div>
            <div class="shipping">
              Shipping & handling
              <div class="price">QAR 10.99</div>
            </div>
          </div>
          <div class="total-button">
            <div class="order-total">
              Order Total
              <div class="price">QAR 145.99</div>
            </div>
            <button class="place-order-button">Place your order</button>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="scripts/checkout.js"></script>
  </body>
</html>
