<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="../../styles/components/headers/sub_header.css"
    />
    <link rel="stylesheet" href="../../styles/pages/accounts.css">
    <title>Login</title>
  </head>
  <body>
    <header>
      <div class="header-logo">
        <a href="../../glam_market.html">
          <img src="/assets/images/icons/glam-logo.svg" alt=""
        /></a>
      </div>
      <div class="header-bow">
        <img src="/assets/images/illustrations/bow-tie.svg" alt="" />
      </div>
    </header>
    <div class="main">
      <div class="account-header">
        <div class="account-heading-title">
          <div class="title">
            <img src="../../assets/images/icons/sparkle.svg" alt="" />
            Welcome Back!
            <img src="../../assets/images/icons/sparkle.svg" alt="" />
          </div>

          <div class="cat-shopping">
            <img
              src="../../assets/images/illustrations/cats_shopping.svg"
              alt=""
            />
          </div>
        </div>
        <div class="account-social-login">
          <img src="../../assets/images/icons/google_icon.svg" alt="" />Continue
          with Google
        </div>
        <div class="account-divider">
          <span class="divider"></span>or<span class="divider"></span>
        </div>
      </div>
      <div class="error-message">
        <img src="../../assets/images/icons/error-icon.svg" alt="">
        Incorrect email or password
      </div>
      <div class="form-group">
        <div class="form-field js-email">
          <label class="field-label" for="email">Email*</label>
          <input class="email" type="email" placeholder="email" required/>
        </div>
        <div class="password-input">
          <div class="form-field js-password">
            <label class="field-label" for="password">Password*</label>
            <input class="password" type="password" placeholder="password" required/>
            <button class="eye">
              <img src="../../assets/images/icons/closed-eye.svg" alt="" />
            </button>
          </div>
          <div class="forgot-password">Forgot your password?</div>
        </div>
        <div class="account-actions">
          <button class="acount-action-button login-button">Login</button>
          <div class="message">
            Don't have an account?
            <a href="create_account.html"><span class="account-switch-link">Create Account</span></a>            
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="../../scripts/accounts/login.js"></script>
  </body>
</html>
