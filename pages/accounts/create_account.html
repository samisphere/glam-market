<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="../../styles/components/headers/sub_header.css"
    />
    <link rel="stylesheet" href="../../styles/pages/accounts.css">
    <title>Create Account</title>
  </head>
  <body>
    <header>
      <div class="header-logo">
        <a href="../../glam_market.html">
          <img src="/assets/images/icons/glam-logo.svg" alt=""
        /></a>
      </div>
      <div class="header-bow">
        <img src="/assets/images/illustrations/bow-tie.svg" alt="" />
      </div>
    </header>
    <div class="main">
      <div class="account-header">
        <div class="account-heading-title">
          <div class="title">
            <img src="../../assets/images/icons/sparkle.svg" alt="" />
            Create Account
            <img src="../../assets/images/icons/sparkle.svg" alt="" />
          </div>

          <div class="cat-shopping">
            <img
              src="../../assets/images/illustrations/cats_shopping.svg"
              alt=""
            />
          </div>
        </div>
        <div class="account-social-login">
          <img src="../../assets/images/icons/google_icon.svg" alt="" />Continue
          with Google
        </div>
        <div class="account-divider">
          <span class="divider"></span>or<span class="divider"></span>
        </div>
      </div>
      <div class="form-group">
         <div class="form-field">
          <label class="field-label" for="name">Full Name*</label>
          <input  type="text" placeholder="full name" required/>
        </div>
        <div class="form-field">
          <label class="field-label" for="email">Email*</label>
          <input  type="email" placeholder="email" required/>
        </div>
        <div class="password-input">
          <div class="form-field">
            <label class="field-label" for="password">Password*</label>
            <input  type="password" placeholder="password" required/>
             <button class="eye">
              <img src="../../assets/images/icons/closed-eye.svg" alt="" />
            </button>
          </div>
        </div>
        <div class="password-input">
          <div class="form-field">
            <label class="field-label" for="confirm-password">ConfirmPassword*</label>
            <input  type="password" placeholder="re-enter password" required/>
             <button class="eye">
              <img src="../../assets/images/icons/closed-eye.svg" alt="" />
            </button>
          </div>
        </div>
        <div class="account-actions">
          <button class="acount-action-button">Create Account</button>
          <div class="message">
            Already have an account?
            <a href="login.html"><span class="account-switch-link">Sign In</span></a>            
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
