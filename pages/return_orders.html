<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Returns & Orders</title>
    <link rel="stylesheet" href="../styles/components/headers/main_header.css" />
    <link rel="stylesheet" href="../styles/pages/return_orders.css" />
  </head>
  <body>
    <header>
      <div class="header-up">
        <div class="header-left">
          <a href="../glam_market.html">
            <img src="/assets/images/icons/glam-logo.svg" alt=""
          /></a>
        </div>
        <form class="header-middle">
          <input
            class="search-input"
            type="text"
            placeholder="search items ..."
          />
          <button type="submit" class="search-button">
            <img src="/assets/images/icons/search.svg" alt="" />
          </button>
        </form>
        <div class="search-results"></div>
        <div class="header-right">
          <a href="../pages/return_orders.html" class="returns-order">
            <span class="return">Returns</span>
            <span class="order">& Order</span></a
          >

          <div class="cart-profile">
            <a href="../pages/cart_items.html" class="cart">
              <img src="/assets/images/icons/main-cart.svg" alt="" />
              <span class="cart-ammount"></span>
            </a>
            <a href="" class="profile">
              <img src="/assets/images/icons/user.svg" alt="" />
            </a>
          </div>
          <div class="bowtie-icon">
            <img src="/assets/images/illustrations/bow-tie.svg" alt="" />
          </div>
        </div>
      </div>
      <div class="header-nav">
        <a href="../glam_market.html">Home</a>
        <a href="../pages/shop.html">Shop</a>
        <a href="">Contact</a>

        <div class="cat-decoration">
          <img
            class="cat-nav-body"
            src="/assets/images/illustrations/cat-nav-body.svg"
            alt=""
          />
        </div>
      </div>
    </header>
    <div class="main">
      <div class="page-tittle">Past Orders</div>
      <div class="empty-orders-container">
        <img src="/assets/images/icons/empty-bag.svg" alt="" />
        <h2>No orders yet!</h2>
        <p>
          You haven't placed any orders yet. <br />Once you make a purchase,
          your order history will appear here.
        </p>
        <a href="../pages/shop.html" class="shop-now-button"> Start Shopping </a>
      </div>
      <div class="orders-grid"></div>
    </div>
    <script src="../scripts/orders/return_orders.js" type="module"></script>
  </body>
</html>
