<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="../styles/components/headers/sub_header.css" />
    <link rel="stylesheet" href="../styles/pages/order_confirmation.css" />
    <title>Order Confirmation</title>
  </head>
  <body>
    <header>
      <div class="header-logo">
        <a href="../glam_market.html">
          <img src="/assets/images/icons/glam-logo.svg" alt=""
        /></a>
      </div>
      <div class="header-middle">
        <div class="page-title">Order Summary</div>
      </div>
      <div class="header-bow">
        <img src="/assets/images/illustrations/bow-tie.svg" alt="" />
      </div>
    </header>
    <div class="main">
      <div class="confirmation-header-image">
        <div class="confirmation-header">
          <div class="confirmation-message">
            <img src="/assets/images/icons/check-circle.svg" alt="" />
            <div class="confirmation-title">Thank You For Your Order!</div>
            <div class="confirmation-description">
              Your order has been succesfully placed
            </div>
          </div>
          <div class="order-reference">
            <div class="order-reference-number">#ORD-20261115</div>
            <div class="order-reference-label">Order reference number</div>
          </div>
        </div>
        <img src="/assets/images/illustrations/girl-thumbs-up.svg" alt="" />
      </div>

      <div class="order-summary">
        <div class="order-title">Order Summary</div>
        <div class="items-shipping">
          <div class="items">
            <div class="item-label">
              Items ( <span class="item-quantity"></span> )
            </div>

            <div class="total-items-price">QAR 0</div>
          </div>
          <div class="shipping">
            Shipping & handling
            <div class="shipping-price">QAR 0</div>
          </div>
        </div>
        <div class="total-button">
          <div class="order-total">
            Order Total
            <div class="total-price">QAR 0</div>
          </div>
        </div>
      </div>
      <div class="delivery-section">
        <div class="delivery-section-title">Delivery Information</div>
        <div class="expected-delivery-label">
          <img src="/assets/images/icons/delivery-icon.svg" alt="" /> Expected Delivery
        </div>
        <div class="delivery-groups"></div>
      </div>
      <div class="other-buttons">
        <button class="continue">Continue Shopping</button>
        <button class="view-details">View order details</button>
      </div>
    </div>
    <script type="module" src="../scripts/orders/order_confirmation.js"></script>
  </body>
</html>
